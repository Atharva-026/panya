<!DOCTYPE html>
<html>
<head><title>Test Checkout</title></head>
<body>
  <h2>Test Checkout</h2>
  <button id="payBtn">Pay ₹2499 for Red Running Shoe</button>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    document.getElementById("payBtn").addEventListener("click", async () => {
      const res = await fetch("http://localhost:3001/api/order/create", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ productId: "6a89cbfb3666cb6a8f4dc0f6", qty: 1 }),
      });
      const data = await res.json();

      const options = {
        key: data.keyId,
        amount: data.amount,
        currency: "INR",
        order_id: data.razorpayOrderId,
        name: "Test Merchant",
        handler: async function (response) {
          const verifyRes = await fetch("http://localhost:3001/api/order/verify", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(response),
          });
          const verifyData = await verifyRes.json();
          alert("Payment result: " + JSON.stringify(verifyData));
        },
      };

      const rzp = new Razorpay(options);
      rzp.open();
    });
  </script>
</body>
</html>
